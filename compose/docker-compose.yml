# ============================================================================
# energy-supervision — full backend stack (FAP-light + FAP-LDP profile)
#   PostgreSQL (bronze/silver/gold/app/auth/dsp) + ORCE (FAP-light core +
#   node-red-contrib-fap-ldp package + app-supervision fragment) + caddy (front:
#   root LDP, /auth, /dsp/*, /app/query, /editor — CORS for the autonomous front)
#   + Keycloak (realm fap-light)
#   + mosquitto (MQTT) + sftp (external source).
# 100% local images (no pull): postgres:16-alpine, ecofacis/xfsc-orce:2.0.13,
#   quay.io/keycloak/keycloak:26.0, caddy:2, eclipse-mosquitto:2, atmoz/sftp:latest.
#
# Started by ./scripts/deploy-local.sh (do not run by hand: .build/ must
# be generated first — assembled flows, initdb, rendered realm).
# ============================================================================
name: energy-supervision

services:
  # ---------------------------------------------------------- PostgreSQL
  postgres:
    # custom FAP-light core image (pg_cron installed — absent from postgres:16-alpine)
    image: fap-light-postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD required in .env}
      POSTGRES_DB: fap
      PG_GATE_PASSWORD: ${PG_GATE_PASSWORD:?required}
      PG_READER_PASSWORD: ${PG_READER_PASSWORD:?required}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?required}
      PG_MATERIALIZER_PASSWORD: ${PG_MATERIALIZER_PASSWORD:-}
      DSP_AGREEMENT_ID: ${DSP_AGREEMENT_ID:-agreement:internal:framework-contract}
    # pg_cron preloaded (in-database materializers, core spec §C1.5)
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=fap"]
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../.build/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fap"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------- ORCE (Node-RED)
  orce:
    # ORCE image of the FAP-light core (pg and modules baked into /data/node_modules,
    # required by the node-red-contrib-fap-ldp package mounted below)
    image: fap-light-orce
    restart: unless-stopped
    environment:
      TZ: UTC
      FLOWS: /data/flows/flows.json
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: fap
      PG_GATE_USER: gate
      PG_GATE_PASSWORD: ${PG_GATE_PASSWORD:?required}
      PG_READER_USER: reader
      PG_READER_PASSWORD: ${PG_READER_PASSWORD:?required}
      PG_APP_USER: app
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?required}
      PG_ADMIN_USER: admin
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD:?required}
      # explicit DSNs (pools of the custom app-supervision + fap-ldp flows)
      PG_GATE_DSN: "postgres://gate:${PG_GATE_PASSWORD}@postgres:5432/fap"
      PG_APP_DSN: "postgres://app:${PG_APP_PASSWORD}@postgres:5432/fap"
      PG_READER_DSN: "postgres://reader:${PG_READER_PASSWORD}@postgres:5432/fap"
      PG_ADMIN_DSN: "postgres://admin:${PG_ADMIN_PASSWORD}@postgres:5432/fap"
      # DSP data plane (core) — the /app/query proxy signs with this secret (D-3)
      DSP_HMAC_SECRET: ${DSP_HMAC_SECRET:?required}
      DSP_DATA_PATH: /dsp/data
      DSP_DATASETS_PATH: /data/dsp-config/datasets.json
      DSP_AGREEMENT_ID: ${DSP_AGREEMENT_ID:-agreement:internal:framework-contract}
      # CR-5: LLM endpoint POST /app/llm (app-supervision flow). Empty by default:
      # without LLM_ENDPOINT, the endpoint answers 503 llm_not_configured (data read + audited).
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ASSETS: ${LLM_ASSETS:-}
      # simulation + SFTP
      SIM_SITE_ID: ${SIM_SITE_ID:-site-berlin-001}
      SIM_SEED: ${SIM_SEED:-fap-light}
      SFTP_HOST: sftp
      SFTP_PORT: "22"
      SFTP_USER: ${SFTP_USER:-fap}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_INGEST_DIR: /ingest
      SFTP_ARCHIVE_DIR: /archive
      SFTP_MAX_BYTES: "1048576"
      # FAP-LDP (fap-ldp node at boot: applies /config/model.json)
      FAP_LDP_CONFIG: /config/model.json
      FAP_LDP_BASE_IRI: "${BASE_IRI:-http://app.localhost/}"   # derived from ENV (dev=http, staging/prod=https)
      FAP_ORG: ${FAP_ORG:-fap-pod}
      # INTERNAL userinfo (from the orce container, via the docker network)
      # Keycloak serves under /auth (--http-relative-path /auth): internal URL with /auth.
      IDP_USERINFO_URL: "http://keycloak:8080/auth/realms/fap-light/protocol/openid-connect/userinfo"
      FAP_LDP_VC_TRUST_ANCHORS: ""
      FAP_LDP_GOLD_MAX_ROWS: "10000"
    ports:
      - "${ORCE_PORT:-1880}:1880"
    # the image declares VOLUME /data: a file→/data/flows.json bind fails ("not a
    # directory") → we mount .build/ as a directory and the custom entrypoint copies flows.json
    # at boot (entrypoint, not command: the image already has an ENTRYPOINT).
    entrypoint: ["/usr/local/bin/orce-app-entrypoint.sh"]
    volumes:
      - ../.build:/flows-app:ro
      - ../scripts/orce-entrypoint.sh:/usr/local/bin/orce-app-entrypoint.sh:ro
      - ../config:/config:ro
      # node-red-contrib-fap-ldp package (extension core, mounted read-only)
      - ../../fap-ldp/core/nodes:/data/node_modules/node-red-contrib-fap-ldp:ro
      # E11 model-injection ext (fap-ldp-mi-boot / fap-ldp-mi-admin nodes, v2 app store)
      - ../../fap-ldp/ext/model-injection:/data/node_modules/node-red-contrib-fap-ldp-model-injection:ro
      # core DSP catalog (datasets.json)
      - ../../fap-light-serveur/deploy/orce/data/dsp-config:/data/dsp-config:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------- IdP (Keycloak 26.x, D-4)
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    restart: unless-stopped
    # Serves under /auth (KC_HOSTNAME=.../auth): caddy does NOT strip the prefix,
    # otherwise Keycloak's DPoP validation (htu) sees a URL without /auth → mismatch.
    command: start-dev --import-realm --http-relative-path /auth
    environment:
      TZ: UTC
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: "${BASE_IRI:-http://app.localhost/}auth"   # issuer = ${BASE_IRI}auth/realms/fap-light
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # caddy strips /auth and forwards X-Forwarded-*: Keycloak must rely on
      # the frontend URL (KC_HOSTNAME) to rebuild the request — otherwise the
      # DPoP check (htu) fails with "DPoP HTTP URL mismatch".
      KC_PROXY_HEADERS: "xforwarded"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../.build/keycloak:/opt/keycloak/data/import:ro
      # custom login theme "fap" (keycloak/themes/fap, selected by realm loginTheme)
      - ../keycloak/themes:/opt/keycloak/themes:ro

  # ---------------------------------------------------------- caddy (TLS frontal)
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}   # informational only — the rendered Caddyfile is fully static
    # lets the front site (app.localhost:80 in dev) proxy the vite server
    # of the client running on the host (no client file is mounted here)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile RENDERED by scripts/deploy-local.sh according to ENV (dev=HTTP :80, staging/prod=HTTPS)
      # The front (../app-supervision) is AUTONOMOUS: NO client file is mounted here.
      - ../.build/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - orce
      - keycloak

  # ---------------------------------------------------------- MQTT broker (sensor sources)
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ../../fap-light-serveur/deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT:-1883}:1883"

  # ---------------------------------------------------------- SFTP server (external source)
  sftp:
    image: atmoz/sftp:latest
    restart: unless-stopped
    command: "${SFTP_USER:-fap}:${SFTP_PASSWORD:-}:::ingest,archive"
    ports:
      - "${SFTP_PUBLISHED_PORT:-2222}:22"
    volumes:
      - ../../fap-light-serveur/deploy/sftp/authorized_keys:/etc/ssh/authorized_keys:ro
      - sftp-data:/home/${SFTP_USER:-fap}

volumes:
  pg-data:
  caddy-data:
  caddy-config:
  sftp-data:
